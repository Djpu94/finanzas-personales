<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Client</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Icons&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Aplica el tema antes de Angular para evitar un parpadeo con el tema incorrecto.
      (function () {
        var pref = 'system';
        try {
          pref = localStorage.getItem('theme.preference') || 'system';
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (dark) document.body.classList.add('dark-theme');
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
