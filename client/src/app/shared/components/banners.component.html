@if (!connectivity.online()) {
  <div class="banner banner--offline" role="status">
    <mat-icon aria-hidden="true">cloud_off</mat-icon>
    <span>Datos sin conexión. Se muestran los últimos datos guardados.</span>
  </div>
}

@if (install.canInstall()) {
  <div class="banner banner--install" role="region" aria-label="Instala la app">
    <span>Instala la app para consultar tus saldos sin conexión.</span>
    <button mat-button type="button" (click)="install.install()">
      Instalar
    </button>
    <button mat-button type="button" (click)="install.dismiss()">
      Ahora no
    </button>
  </div>
}
