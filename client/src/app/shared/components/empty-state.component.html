<section class="empty-state" [class]="'empty-state--' + size()">
  <mat-icon class="empty-state__icon" aria-hidden="true">{{ icon() }}</mat-icon>
  <h3 class="empty-state__title">{{ title() }}</h3>
  @if (message()) {
    <p class="empty-state__message">{{ message() }}</p>
  }
  @if (ctaLabel() && ctaLink()) {
    <a mat-flat-button [routerLink]="ctaLink()">{{ ctaLabel() }}</a>
  } @else if (ctaLabel()) {
    <button mat-flat-button type="button" (click)="cta.emit()">
      {{ ctaLabel() }}
    </button>
  }
</section>
